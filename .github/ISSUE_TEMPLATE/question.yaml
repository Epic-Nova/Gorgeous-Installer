name: Question
description: Ask about installation, packaging, or publishing
title: "[Question]: "
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to know?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and what you tried
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Operating system, Unreal Engine version, pack type
